name: CRIT Quality Audit

on:
  pull_request:
    branches: [ master, main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for git diff to work correctly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Ensure all dependencies from pyproject.toml are present
          pip install -r requirements.txt

      - name: Run CRIT Audit (Diff Mode)
        id: crit_audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # We use --diff to only analyze modified code in the PR
          python crit_orchestrator.py --diff
        continue-on-error: true # We want to handle the failure and comment

      - name: Post Audit Report to PR
        if: steps.crit_audit.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f "CRIT_Diff_Audit_Report.md" ]; then
            REPORT_CONTENT=$(cat CRIT_Diff_Audit_Report.md)
            
            # Escape the content for JSON
            JSON_PAYLOAD=$(jq -n --arg body "$REPORT_CONTENT" '{body: $body}')
            
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments \
              -d "$JSON_PAYLOAD"
            
            echo "❌ CRIT Audit Failed. Report posted to PR."
            exit 1 # Re-fail the job after posting the comment
          else
            echo "⚠️ CRIT_Diff_Audit_Report.md not found. Audit might have failed before report generation."
            exit 1
          fi
